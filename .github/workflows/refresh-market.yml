name: refresh-polymarket-snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh Polymarket snapshot
        run: node .github/scripts/refresh-market.js
      - name: Refresh actual results
        continue-on-error: true
        run: node .github/scripts/refresh-results.js
      - name: Commit if changed
        run: |
          git config user.name "worlds26-bot"
          git config user.email "worlds26-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no market/results changes"
          else
            git commit -m "Refresh market and actual results"
            git push
          fi
